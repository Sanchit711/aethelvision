[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aethelvision"
version = "1.0.0"
description = "Aethel Vision: Enterprise Edge AI Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
aethel = "aethel.cli:main"

[tool.setuptools.packages.find]
include = ["aethel*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
