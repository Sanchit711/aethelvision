# Aurelix Detector Production Training Configuration Manifest

model:
  num_classes: 80
  depth_multiple: 1.0
  width_multiple: 1.0

training:
  epochs: 100
  batch_size: 16
  learning_rate: 0.001
  min_lr: 0.00001
  weight_decay: 0.0005
  momentum: 0.937
  optimizer: "AdamW"        # AdamW, SGD, Adam
  scheduler: "CosineAnnealing" # CosineAnnealing, OneCycle, Linear, StepLR
  warmup_epochs: 3
  warmup_initial_lr: 0.000001
  precision: "fp16"          # fp16, fp32
  device: "cuda"             # cuda, cpu
  grad_accum_steps: 1
  max_grad_norm: 10.0
  ema: true
  ema_decay: 0.9999
  ema_tau: 2000.0
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0001
  early_stopping_monitor: "val_loss" # val_loss, mAP50, mAP50-95
  val_interval: 1
  checkpoint_interval: 5
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  num_workers: 4
  seed: 42
  deterministic: true

dataset:
  dataset_path: "datasets/default"

loss:
  box_weight: 7.5
  dfl_weight: 1.5
  cls_weight: 0.5
  reg_max: 16
