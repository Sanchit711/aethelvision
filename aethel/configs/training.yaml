# Aurelix Vision Framework Training Setup Specification
training:
  epochs: 100
  batch_size: 16
  num_workers: 4
  device: "cuda"
  amp: true
  accumulate_steps: 1
  clip_grad: 10.0
  seed: 42
  deterministic: true
  patience: 15
  output_dir: "runs/train/exp1"

optimizer:
  name: "AdamW"
  lr: 0.001
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: "CosineAnnealingLR"
  min_lr: 0.00001
  warmup_epochs: 3

loss:
  name: "CompositeDetectionLoss"
  box_weight: 7.5
  cls_weight: 0.5
  dfl_weight: 1.5
  iou_type: "ciou"
  focal_alpha: 0.25
  focal_gamma: 2.0
  reg_max: 16

checkpoint:
  save_period: 5
  save_best: true
  save_latest: true
