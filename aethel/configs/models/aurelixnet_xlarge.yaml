# AurelixNet-XLarge Model Specification
model:
  name: "aurelixnet_xlarge"
  family: "AurelixNet"
  variant: "xlarge"
  num_classes: 80
  depth_multiple: 1.33
  width_multiple: 1.25
  channels: [160, 320, 640]
  reg_max: 16
  act: "silu"
  norm: "batchnorm"
  target_parameters: "68.4M"
  target_gflops: "165.2"
  backbone:
    name: "CSPBackbone"
  neck:
    name: "PAFPN"
  head:
    name: "DecoupledDetectHead"
